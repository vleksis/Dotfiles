version: 2

updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    cooldown:
      default-days: 7
    groups:
      flake-inputs:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Moscow
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
