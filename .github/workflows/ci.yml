name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Justfile
            packages: nixpkgs#just
            recipe: lint-just
          - name: GitHub Actions
            packages: nixpkgs#just nixpkgs#actionlint
            recipe: lint-actions
          - name: secrets
            packages: nixpkgs#just nixpkgs#gitleaks
            recipe: lint-secrets
          - name: Nix
            packages: nixpkgs#just nixpkgs#statix nixpkgs#deadnix
            recipe: lint-nix

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/determinate-nix-action@v3

      - run: nix shell --inputs-from . ${{ matrix.packages }} --command just ${{ matrix.recipe }}

  check:
    name: Check configuration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      - run: nix shell --inputs-from . nixpkgs#just --command just check-config

  mikasa:
    name: Mikasa (NixOS)
    needs: [lint, check]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Build Mikasa
        run: nix build .#nixosConfigurations.mikasa.config.system.build.toplevel --no-link

  okabe:
    name: Okabe (NixOS)
    needs: [lint, check]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Build Okabe
        run: nix build .#nixosConfigurations.okabe.config.system.build.toplevel --no-link

  eren:
    name: Eren (nix-darwin)
    needs: [lint, check]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/determinate-nix-action@v3

      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Build Eren
        run: nix build .#darwinConfigurations.eren.system --no-link
