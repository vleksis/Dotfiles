name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hooks
            # The separate history scan replaces staged-only Gitleaks in CI.
            command: env SKIP=gitleaks pre-commit run --all-files
          - name: secrets
            command: just lint-secrets

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: DeterminateSystems/determinate-nix-action@v3.22.2

      - run: nix develop --command ${{ matrix.command }}

  check:
    name: Check configuration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/determinate-nix-action@v3.22.2

      - run: nix shell --inputs-from . nixpkgs#just --command just check-config

  mikasa:
    name: Mikasa (NixOS)
    needs: [lint, check]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/determinate-nix-action@v3.22.2

      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Build Mikasa
        run: nix build .#nixosConfigurations.mikasa.config.system.build.toplevel --no-link

  okabe:
    name: Okabe (NixOS)
    needs: [lint, check]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/determinate-nix-action@v3.22.2

      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Build Okabe
        run: nix build .#nixosConfigurations.okabe.config.system.build.toplevel --no-link

  eren:
    name: Eren (nix-darwin)
    needs: [lint, check]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/determinate-nix-action@v3.22.2

      - uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Build Eren
        run: nix build .#darwinConfigurations.eren.system --no-link
