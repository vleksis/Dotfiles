name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: hooks
            # The separate history scan replaces staged-only Gitleaks in CI.
            command: env SKIP=gitleaks just lint-hooks
          - name: secrets
            command: just lint-secrets

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28  # v3.23.3

      - run: nix develop --command ${{ matrix.command }}

  check:
    name: Check configuration
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28  # v3.23.3

      - run: nix shell --inputs-from . nixpkgs#just --command just check-config

  mikasa:
    name: Mikasa (NixOS)
    needs: [lint, check]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28  # v3.23.3

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7  # v15
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Build Mikasa
        run: nix build .#nixosConfigurations.mikasa.config.system.build.toplevel --no-link

  okabe:
    name: Okabe (NixOS)
    needs: [lint, check]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28  # v3.23.3

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7  # v15
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Build Okabe
        run: nix build .#nixosConfigurations.okabe.config.system.build.toplevel --no-link

  daru:
    name: Daru (NixOS)
    needs: [lint, check]
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28  # v3.23.3

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7  # v15
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Build Daru
        run: nix build .#nixosConfigurations.daru.config.system.build.toplevel --no-link

  eren:
    name: Eren (nix-darwin)
    needs: [lint, check]
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28  # v3.23.3

      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7  # v15
        with:
          use-flakehub: false
          use-gha-cache: true

      - name: Build Eren
        run: nix build .#darwinConfigurations.eren.system --no-link
